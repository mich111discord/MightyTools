name: VDownloader Engine

on:
  repository_dispatch:
    types: [download_video]

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install yt-dlp & ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Download Video or Audio
        env:
          URL: ${{ github.event.client_payload.url }}
          FORMAT: ${{ github.event.client_payload.format }}
          QUALITY: ${{ github.event.client_payload.quality }}
        run: |
          mkdir -p output
          cd output
          
          if [ "$FORMAT" = "mp3" ]; then
            yt-dlp -x --audio-format mp3 --audio-quality 0 "$URL" -o "%(title)s.%(ext)s"
          else
            if [ "$QUALITY" = "best" ]; then
              yt-dlp -f "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best" --merge-output-format mp4 "$URL" -o "%(title)s.%(ext)s"
            else
              yt-dlp -f "bestvideo[height<=${QUALITY}][ext=mp4]+bestaudio[ext=m4a]/best[height<=${QUALITY}][ext=mp4]/best" --merge-output-format mp4 "$URL" -o "%(title)s.%(ext)s"
            fi
          fi

      - name: Upload Output as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-media
          path: output/
          retention-days: 1
