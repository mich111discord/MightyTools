<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PowerShell to BAT Converter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    :root {
      --primary: #36454F;
      --primary-light: #4a5e6e;
      --primary-dark: #253340;
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent-gold: #f0b90b;
      --border-color: rgba(54, 69, 79, 0.4);
      --shadow: 0 8px 32px rgba(54, 69, 79, 0.3);
      --shadow-hover: 0 16px 48px rgba(54, 69, 79, 0.4);
      --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, #5a6d7a 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(circle at 20% 80%, rgba(54,69,79,0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(54,69,79,0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(54,69,79,0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
      animation: float 20s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      33% { transform: translateY(-20px) rotate(1deg); }
      66% { transform: translateY(10px) rotate(-1deg); }
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 3rem 2rem;
      min-height: 100vh;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hero-title {
      text-align: left;
    }

    .hero-title h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 800;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary) 70%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.75rem 1.4rem;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: var(--primary);
      border-color: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .converter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 900px) {
      .converter-grid {
        grid-template-columns: 1fr;
      }
      .hero-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    .editor-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      color: var(--accent-gold);
    }

    textarea, input[type="text"], select {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
    }

    textarea {
      height: 320px;
      resize: vertical;
    }

    textarea:focus, input[type="text"]:focus, select:focus {
      border-color: var(--primary-light);
    }

    .options-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      box-shadow: var(--shadow);
    }

    .options-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-gold);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1rem;
    }

    .sub-options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .checkbox-container input {
      accent-color: var(--primary-light);
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      background: var(--gradient-primary);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.85rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
    }

    .btn-secondary {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="hero-header">
      <div class="hero-title">
        <h1>PowerShell to BAT Converter</h1>
        <p style="color: var(--text-secondary);">Wklej skrypt PowerShell (.ps1) i wygeneruj gotowy plik wykonywalny .BAT</p>
      </div>
      <a href="index.html" class="btn-home">
        <i class="fas fa-home"></i> Strona Główna
      </a>
    </div>

    <div class="converter-grid">
      <div class="editor-card">
        <div class="editor-header">
          <span><i class="fab fa-windows"></i> PowerShell Input (.ps1)</span>
        </div>
        <textarea id="ps-input" placeholder="Write-Host 'Hello World!'"></textarea>
      </div>

      <div class="editor-card">
        <div class="editor-header">
          <span><i class="fas fa-terminal"></i> Batch Output (.bat)</span>
        </div>
        <textarea id="bat-output" readonly placeholder="Kliknij konwertuj, aby zobaczyć wynik..."></textarea>
      </div>
    </div>

    <div class="options-card">
      <div class="options-title">
        <i class="fas fa-sliders-h"></i> Opcje konwersji i Warunki Uruchomienia
      </div>
      
      <div class="options-grid">
        <label class="checkbox-container">
          <input type="checkbox" id="opt-admin"> Wymagaj Administratora (UAC)
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-legacy-delay"> Ping zamiast Timeout (Win 7)
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-hidden"> Ukryj okno konsoli (Silent Mode)
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-pause" checked> Pause na końcu skryptu
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-self-delete"> Utwórz skrypt samokasujący (.BAT)
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-netreq" onchange="toggleInputs()"> Wymagaj połączenia z Internetem
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-sysreq" onchange="toggleInputs()"> Wymagaj minimalnej wersji Windows
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-psreq" onchange="toggleInputs()"> Wymagaj minimalnej wersji PowerShell
        </label>
        <label class="checkbox-container">
          <input type="checkbox" id="opt-force64"> Wymuś uruchomienie w 64-bit PowerShell
        </label>
      </div>

      <div class="sub-options-grid" id="sysreq-box" style="display: none;">
        <div>
          <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">Wymagany system:</label>
          <select id="opt-min-os">
            <option value="6.1">Windows 7 / Server 2008 R2</option>
            <option value="6.2">Windows 8 / Server 2012</option>
            <option value="6.3">Windows 8.1 / Server 2012 R2</option>
            <option value="10.0">Windows 10 / Server 2016+</option>
            <option value="10.0.22000">Windows 11 (Kompilacja 22000+)</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">Błąd braku zgodności OS:</label>
          <input type="text" id="opt-sysreq-msg" value="System nie jest zgodny z tym skryptem!">
        </div>
      </div>

      <div class="sub-options-grid" id="psreq-box" style="display: none;">
        <div>
          <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">Wymagana wersja PowerShell:</label>
          <select id="opt-min-ps">
            <option value="3.0">PowerShell 3.0+</option>
            <option value="5.1">PowerShell 5.1 (Standard Win 10)</option>
            <option value="7.0">PowerShell Core 7.0+</option>
          </select>
        </div>
        <div>
          <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">Błąd braku wersji PS:</label>
          <input type="text" id="opt-psreq-msg" value="Wymagana nowsza wersja PowerShell!">
        </div>
      </div>

      <div class="sub-options-grid" id="netreq-box" style="display: none;">
        <div style="grid-column: 1 / -1;">
          <label style="font-size: 0.85rem; color: var(--text-secondary); display: block; margin-bottom: 0.4rem;">Błąd braku połączenia z siecią:</label>
          <input type="text" id="opt-netreq-msg" value="Brak połączenia z Internetem! Przerwanie wykonywania.">
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" onclick="convertPS2BAT()"><i class="fas fa-bolt"></i> Konwertuj</button>
      <button class="btn btn-secondary" onclick="copyOutput()"><i class="fas fa-copy"></i> Kopiuj .BAT</button>
      <button class="btn btn-secondary" onclick="downloadBAT()"><i class="fas fa-download"></i> Pobierz plik .bat</button>
    </div>
  </main>

  <script>
    function toggleInputs() {
      const isSysChecked = document.getElementById('opt-sysreq').checked;
      document.getElementById('sysreq-box').style.display = isSysChecked ? 'grid' : 'none';

      const isPsChecked = document.getElementById('opt-psreq').checked;
      document.getElementById('psreq-box').style.display = isPsChecked ? 'grid' : 'none';

      const isNetChecked = document.getElementById('opt-netreq').checked;
      document.getElementById('netreq-box').style.display = isNetChecked ? 'grid' : 'none';
    }

    function convertPS2BAT() {
      const psCode = document.getElementById('ps-input').value;
      if (!psCode.trim()) {
        alert("Wklej najpierw kod PowerShell!");
        return;
      }
      
      const reqAdmin = document.getElementById('opt-admin').checked;
      const legacyDelay = document.getElementById('opt-legacy-delay').checked;
      const hiddenWindow = document.getElementById('opt-hidden').checked;
      const addPause = document.getElementById('opt-pause').checked;
      const selfDelete = document.getElementById('opt-self-delete').checked;
      const force64 = document.getElementById('opt-force64').checked;
      
      const checkSysReq = document.getElementById('opt-sysreq').checked;
      const minOS = document.getElementById('opt-min-os').value;
      const sysMsg = document.getElementById('opt-sysreq-msg').value || "System nie jest zgodny z tym skryptem!";

      const checkPsReq = document.getElementById('opt-psreq').checked;
      const minPS = document.getElementById('opt-min-ps').value;
      const psMsg = document.getElementById('opt-psreq-msg').value || "Wymagana nowsza wersja PowerShell!";

      const checkNetReq = document.getElementById('opt-netreq').checked;
      const netMsg = document.getElementById('opt-netreq-msg').value || "Brak połączenia z Internetem!";

      const byteArray = new Uint8Array(psCode.length * 2);
      for (let i = 0; i < psCode.length; i++) {
        const code = psCode.charCodeAt(i);
        byteArray[i * 2] = code & 0xff;
        byteArray[i * 2 + 1] = (code >> 8) & 0xff;
      }
      
      let binary = '';
      byteArray.forEach(b => binary += String.fromCharCode(b));
      const base64PS = btoa(binary);

      let batParts = ["@echo off", "cd /d \"%~dp0\""];

      if (force64) {
        batParts.push(":: Redirect to 64-bit PowerShell if running under SysWOW64");
        batParts.push("if exist \"%SystemRoot%\\SysNative\\WindowsPowerShell\\v1.0\\powershell.exe\" (");
        batParts.push(`  \"%SystemRoot%\\SysNative\\WindowsPowerShell\\v1.0\\powershell.exe\" -NoProfile -ExecutionPolicy Bypass -File \"%~f0\" %*`);
        batParts.push("  exit /b");
        batParts.push(")");
      }

      if (checkSysReq) {
        batParts.push(":: Minimal OS Version Check");
        batParts.push(`powershell -NoProfile -ExecutionPolicy Bypass -Command "$v=[System.Environment]::OSVersion.Version; if ($v -lt [Version]'${minOS}') { Write-Host '${sysMsg}' -ForegroundColor Red; exit 1 }"` + " || (");
        if (addPause && !hiddenWindow) {
          if (legacyDelay) { batParts.push("  ping 127.0.0.1 -n 3 >nul"); } else { batParts.push("  pause"); }
        }
        batParts.push("  exit /b 1");
        batParts.push(")");
      }

      if (checkPsReq) {
        batParts.push(":: Minimal PowerShell Version Check");
        batParts.push(`powershell -NoProfile -ExecutionPolicy Bypass -Command "if ($PSVersionTable.PSVersion -lt [Version]'${minPS}') { Write-Host '${psMsg}' -ForegroundColor Red; exit 1 }"` + " || (");
        if (addPause && !hiddenWindow) {
          if (legacyDelay) { batParts.push("  ping 127.0.0.1 -n 3 >nul"); } else { batParts.push("  pause"); }
        }
        batParts.push("  exit /b 1");
        batParts.push(")");
      }

      if (checkNetReq) {
        batParts.push(":: Internet Connection Check");
        batParts.push("ping -n 1 8.8.8.8 >nul 2>&1 || (");
        batParts.push(`  echo ${netMsg}`);
        if (addPause && !hiddenWindow) {
          if (legacyDelay) { batParts.push("  ping 127.0.0.1 -n 3 >nul"); } else { batParts.push("  pause"); }
        }
        batParts.push("  exit /b 1");
        batParts.push(")");
      }

      if (reqAdmin) {
        batParts.push(":: Auto-elevation to Administrator with directory retention");
        batParts.push("NET FILE >nul 2>&1 || (");
        batParts.push('  powershell -NoProfile -ExecutionPolicy Bypass -Command "Start-Process -FilePath \'%~f0\' -Verb RunAs -WorkingDirectory \'%~dp0\'"');
        batParts.push("  exit /b");
        batParts.push(")");
      }

      let psFlags = "-NoProfile -ExecutionPolicy Bypass";
      if (hiddenWindow) {
        psFlags += " -WindowStyle Hidden";
      }

      batParts.push(`powershell ${psFlags} -EncodedCommand ${base64PS}`);

      if (addPause && !hiddenWindow) {
        if (legacyDelay) {
          batParts.push(":: Win7/Legacy delay simulation using ping");
          batParts.push("ping 127.0.0.1 -n 3 >nul");
        } else {
          batParts.push("pause");
        }
      }

      if (selfDelete) {
        batParts.push(":: Self-delete script after execution");
        batParts.push("(goto) 2>nul & del \"%~f0\"");
      }

      document.getElementById('bat-output').value = batParts.join("\n");
    }

    function copyOutput() {
      const batArea = document.getElementById('bat-output');
      if (!batArea.value) return;
      batArea.select();
      navigator.clipboard.writeText(batArea.value);
      alert("Skopiowano kod BAT do schowka!");
    }

    function downloadBAT() {
      const text = document.getElementById('bat-output').value;
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain' });
      const anchor = document.createElement('a');
      anchor.download = 'converted_script.bat';
      anchor.href = window.URL.createObjectURL(blob);
      anchor.dataset.downloaduri = ['text/plain', anchor.download, anchor.href].join(':');
      anchor.click();
    }
  </script>
</body>
</html>
