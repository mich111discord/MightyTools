<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VDownloader - Universal Media Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    :root {
      --primary: #36454F;
      --primary-light: #4a5e6e;
      --primary-dark: #253340;
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent-gold: #f0b90b;
      --accent-green: #2ea44f;
      --accent-red: #da3633;
      --border-color: rgba(54, 69, 79, 0.4);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 16px 48px rgba(54, 69, 79, 0.4);
      --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, #5a6d7a 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hero-title h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      padding: 0.75rem 1.3rem;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: var(--primary);
      transform: translateY(-2px);
    }

    .download-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label, .options-grid label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.5rem;
    }

    input[type="url"], select {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--gradient-primary);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .status-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .btn-download-direct {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-green);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="container">
    <div class="hero-header">
      <div class="hero-title">
        <h1>VDownloader</h1>
        <p style="color: var(--text-secondary);">Uniwersalne narzędzie do pobierania wideo i audio</p>
      </div>
      <a href="../../" class="btn-home"><i class="fas fa-home"></i> Główna</a>
    </div>

    <div class="download-card">
      <div class="form-group">
        <label for="video-url">Adres URL wideo / audio:</label>
        <input type="url" id="video-url" placeholder="Wklej link z TikTok, YouTube, Twitter, Instagram..." required />
      </div>

      <div class="options-grid">
        <div>
          <label for="opt-format">Typ pliku:</label>
          <select id="opt-format">
            <option value="video">Wideo (MP4)</option>
            <option value="audio">Audio (MP3)</option>
          </select>
        </div>
        <div>
          <label for="opt-quality">Jakość:</label>
          <select id="opt-quality">
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="480">480p</option>
            <option value="360">360p</option>
          </select>
        </div>
      </div>

      <button class="btn" id="btn-submit" onclick="fetchVideo()">
        <i class="fas fa-download"></i> Przetwarzaj i Pobierz
      </button>
    </div>

    <div class="status-card" id="status-box">
      <div class="status-header" id="status-title"></div>
      <div class="status-details" id="status-desc"></div>
    </div>
  </main>

  <script>
    const API_KEY_SAVENOW = "dfcb6d76f2f6a9894gjkege8a4ab232222";
    const API_SAVENOW_BASE = "https://p.savenow.to/api/v2/download";
    const PROGRESS_SAVENOW_BASE = "https://p.savenow.to/api/progress";

    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 8000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    function updateStatus(title, desc, color = '#f0b90b') {
      const statusTitle = document.getElementById('status-title');
      const statusDesc = document.getElementById('status-desc');
      statusTitle.style.color = color;
      statusTitle.innerHTML = title;
      statusDesc.innerHTML = desc;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 1. YouTube via savenow.to API
    async function fetchSaveNowYT(url, quality, format) {
      const requestedFormat = (format === 'audio') ? 'mp3' : (quality || '1080');
      const apiReqUrl = `${API_SAVENOW_BASE}?format=${encodeURIComponent(requestedFormat)}&url=${encodeURIComponent(url)}&apikey=${API_KEY_SAVENOW}`;

      try {
        updateStatus(`<span class="spinner"></span> Inicjalizacja YouTube API...`, 'Wysyłanie zapytania konwersji...');
        const res = await fetchWithTimeout(apiReqUrl, { timeout: 10000 });
        if (!res.ok) return null;
        const data = await res.json();

        if (!data || !data.success || !data.id) {
          return null;
        }

        const taskId = data.id;
        const progressUrl = `${PROGRESS_SAVENOW_BASE}?id=${taskId}`;

        // Polling o postęp
        for (let attempt = 0; attempt < 60; attempt++) {
          await sleep(2000);

          try {
            const progRes = await fetchWithTimeout(progressUrl, { timeout: 5000 });
            if (!progRes.ok) continue;
            const progData = await progRes.json();

            const rawProgress = progData.progress || 0;
            const percent = Math.min(100, Math.round(rawProgress / 10));
            const progressText = progData.text || `Przetwarzanie... ${percent}%`;

            updateStatus(
              `<span class="spinner"></span> Konwertowanie YouTube (${percent}%)`,
              `Status: ${progressText}`
            );

            if (progData.download_url) {
              return {
                url: progData.download_url,
                title: progData.title || 'YouTube_Video'
              };
            }
          } catch (e) {
            console.warn("Błąd podczas odpytywania o postęp savenow:", e);
          }
        }
      } catch (e) {
        console.warn("SaveNow API Error:", e);
      }
      return null;
    }

    // 2. TikTok via SnapTik Engine API
    async function fetchSnapTik(url) {
      try {
        updateStatus(`<span class="spinner"></span> Pobieranie z TikTok...`, 'Łączenie ze SnapTik Engine...');
        const formData = new FormData();
        formData.append('url', url);

        const res = await fetchWithTimeout('https://snapx.app/api/ajaxSearch', {
          method: 'POST',
          body: formData,
          timeout: 8000
        });

        if (!res.ok) return null;
        const data = await res.json();

        if (data && data.status === 'ok' && data.data) {
          const parser = new DOMParser();
          const doc = parser.parseFromString(data.data, 'text/html');
          
          const downloadBtn = doc.querySelector('a.button.download-file') || 
                              doc.querySelector('a[href*="snaptik"]') || 
                              doc.querySelector('a.btn-download') ||
                              doc.querySelector('a[href*="tikmate"]');

          if (downloadBtn && downloadBtn.href) {
            return downloadBtn.href;
          }
        }
      } catch (e) {
        console.warn("SnapTik API Fallback attempt...", e);
      }

      // Fallback TikTok TikWM
      try {
        const res = await fetchWithTimeout(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`, { timeout: 6000 });
        if (res.ok) {
          const data = await res.json();
          if (data && data.code === 0) {
            return data.data.play;
          }
        }
      } catch (e) {
        console.warn("TikWM Fallback failed");
      }

      return null;
    }

    // 3. Twitter / X Engine
    async function fetchTwitter(url) {
      try {
        const match = url.match(/status\/(\d+)/);
        if (!match) return null;
        const res = await fetchWithTimeout(`https://api.vxtwitter.com/Twitter/status/${match[1]}`, { timeout: 6000 });
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.media_extend && data.media_extend[0]) {
          return data.media_extend[0].url;
        }
      } catch (e) { console.warn("Twitter API error"); }
      return null;
    }

    // 4. Cobalt Engine (Fallback ogólny)
    async function fetchCobalt(urlInput, quality, format) {
      const payload = {
        url: urlInput,
        videoQuality: quality,
        downloadMode: format === 'audio' ? 'audio' : 'auto',
        audioFormat: 'mp3'
      };

      const cobaltInstances = [
        'https://co.wuk.sh/api/json',
        'https://cobalt-api.kwiatekm.pl/',
        'https://api.cobalt.crush.top/',
        'https://cobalt.api.sc7.io/'
      ];

      for (const instanceUrl of cobaltInstances) {
        try {
          const res = await fetchWithTimeout(instanceUrl, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            timeout: 5000
          });

          if (!res.ok) continue;
          const data = await res.json();
          const directUrl = data.url || (data.picker && data.picker[0] ? data.picker[0].url : null);
          if (directUrl) return directUrl;
        } catch (e) { continue; }
      }
      return null;
    }

    // Main execution
    async function fetchVideo() {
      const urlInput = document.getElementById('video-url').value.trim();
      const format = document.getElementById('opt-format').value;
      const quality = document.getElementById('opt-quality').value;

      if (!urlInput) {
        alert("Podaj prawidłowy adres URL!");
        return;
      }

      const btn = document.getElementById('btn-submit');
      const statusBox = document.getElementById('status-box');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Przetwarzanie...`;
      statusBox.style.display = 'block';

      let downloadUrl = null;
      let engineUsed = '';

      // Test 1: YouTube (savenow.to API)
      if (urlInput.includes('youtube.com') || urlInput.includes('youtu.be')) {
        const ytResult = await fetchSaveNowYT(urlInput, quality, format);
        if (ytResult && ytResult.url) {
          downloadUrl = ytResult.url;
          engineUsed = 'SaveNow YouTube API (1080p Engine)';
        }
      }

      // Test 2: TikTok (SnapTik)
      if (!downloadUrl && (urlInput.includes('tiktok.com') || urlInput.includes('vm.tiktok.com'))) {
        downloadUrl = await fetchSnapTik(urlInput);
        if (downloadUrl) engineUsed = 'SnapTik Engine';
      }

      // Test 3: Twitter / X
      if (!downloadUrl && (urlInput.includes('twitter.com') || urlInput.includes('x.com'))) {
        downloadUrl = await fetchTwitter(urlInput);
        if (downloadUrl) engineUsed = 'VxTwitter Engine';
      }

      // Test 4: Cobalt Network (Fallback dla reszty)
      if (!downloadUrl) {
        updateStatus(`<span class="spinner"></span> Łączenie z pomocniczym API...`, 'Skanowanie Cobalt Network...');
        downloadUrl = await fetchCobalt(urlInput, quality, format);
        if (downloadUrl) engineUsed = 'Cobalt Network Engine';
      }

      // Result rendering
      if (downloadUrl) {
        updateStatus(
          `<i class="fas fa-check-circle"></i> Gotowe! (${engineUsed})`,
          `Plik wygenerowany pomyślnie.<br>
           <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn-download-direct" download>
             <i class="fas fa-file-download"></i> Pobierz plik teraz
           </a>`,
          '#2ea44f'
        );
      } else {
        updateStatus(
          `<i class="fas fa-exclamation-triangle"></i> Błąd pobierania`,
          `Nie udało się wygenerować bezpośredniego linku do pobrania. Upewnij się, że link jest poprawny i materiał jest publiczny.`,
          '#da3633'
        );
      }

      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-download"></i> Przetwarzaj i Pobierz`;
    }
  </script>
</body>
</html>
