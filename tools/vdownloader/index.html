<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VDownloader - Universal Media Downloader</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <style>
    :root {
      --primary: #36454F;
      --primary-light: #4a5e6e;
      --primary-dark: #253340;
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-card: #21262d;
      --text-primary: #f0f6fc;
      --text-secondary: #8b949e;
      --accent-gold: #f0b90b;
      --accent-green: #2ea44f;
      --accent-red: #da3633;
      --border-color: rgba(54, 69, 79, 0.4);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-hover: 0 16px 48px rgba(54, 69, 79, 0.4);
      --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, #5a6d7a 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hero-title h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--primary-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      padding: 0.75rem 1.3rem;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .btn-home:hover {
      background: var(--primary);
      transform: translateY(-2px);
    }

    .download-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: var(--shadow);
      margin-bottom: 2rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-group label, .options-grid label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 0.5rem;
    }

    input[type="url"], select {
      width: 100%;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.85rem 1.1rem;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      outline: none;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: var(--gradient-primary);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.9rem 2rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
    }

    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .status-card {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .status-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .btn-download-direct {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent-green);
      color: #fff;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      margin-top: 1rem;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <main class="container">
    <div class="hero-header">
      <div class="hero-title">
        <h1>VDownloader</h1>
        <p style="color: var(--text-secondary);">Uniwersalne narzędzie do pobierania wideo i audio</p>
      </div>
      <a href="../../" class="btn-home"><i class="fas fa-home"></i> Główna</a>
    </div>

    <div class="download-card">
      <div class="form-group">
        <label for="video-url">Adres URL wideo / audio:</label>
        <input type="url" id="video-url" placeholder="Wklej link z TikTok, YouTube, Twitter, Instagram..." required />
      </div>

      <div class="options-grid">
        <div>
          <label for="opt-format">Typ pliku:</label>
          <select id="opt-format">
            <option value="video">Wideo (MP4)</option>
            <option value="audio">Audio (MP3)</option>
          </select>
        </div>
        <div>
          <label for="opt-quality">Jakość:</label>
          <select id="opt-quality">
            <option value="1080">1080p</option>
            <option value="720">720p</option>
            <option value="max">Maksymalna</option>
          </select>
        </div>
      </div>

      <button class="btn" id="btn-submit" onclick="fetchVideo()">
        <i class="fas fa-download"></i> Przetwarzaj i Pobierz
      </button>
    </div>

    <div class="status-card" id="status-box">
      <div class="status-header" id="status-title"></div>
      <div class="status-details" id="status-desc"></div>
    </div>
  </main>

  <script>
    // Pomocniczy fetch z bezpiecznym timeoutem (np. gdy serwer API wisi)
    async function fetchWithTimeout(resource, options = {}) {
      const { timeout = 5000 } = options;
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeout);
      try {
        const response = await fetch(resource, { ...options, signal: controller.signal });
        clearTimeout(id);
        return response;
      } catch (e) {
        clearTimeout(id);
        throw e;
      }
    }

    function extractYouTubeId(url) {
      const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 1. TikTok - TikWM
    async function fetchTikTok(url) {
      try {
        const res = await fetchWithTimeout(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`, { timeout: 6000 });
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.code === 0) {
          return { video: data.data.play, audio: data.data.music };
        }
      } catch (e) { console.warn("TikTok API nie odpowiedziało"); }
      return null;
    }

    // 2. Twitter / X - VxTwitter API
    async function fetchTwitter(url) {
      try {
        const match = url.match(/status\/(\d+)/);
        if (!match) return null;
        const res = await fetchWithTimeout(`https://api.vxtwitter.com/Twitter/status/${match[1]}`, { timeout: 6000 });
        if (!res.ok) return null;
        const data = await res.json();
        if (data && data.media_extend && data.media_extend[0]) {
          return data.media_extend[0].url;
        }
      } catch (e) { console.warn("Twitter API nie odpowiedziało"); }
      return null;
    }

    // 3. YouTube Direct Engine (Invidious / Piped z rotacją instancji)
    async function fetchYouTube(ytId, format) {
      const ytInstances = [
        `https://invidious.nerdvpn.de/api/v1/videos/${ytId}`,
        `https://inv.nadeko.net/api/v1/videos/${ytId}`,
        `https://api.piped.yt/streams/${ytId}`
      ];

      for (const endpoint of ytInstances) {
        try {
          const res = await fetchWithTimeout(endpoint, { timeout: 4000 });
          if (!res.ok) continue;
          const data = await res.json();

          if (endpoint.includes('piped')) {
            if (format === 'audio') {
              return data.audioStreams?.[0]?.url || null;
            }
            return data.videoStreams?.find(v => v.quality === '720p')?.url || data.videoStreams?.[0]?.url || null;
          } else {
            if (format === 'audio') {
              const audioStream = data.adaptiveFormats?.find(f => f.type?.includes('audio'));
              if (audioStream) return audioStream.url;
            }
            const videoStream = data.formatStreams?.find(f => f.qualityLabel === '720p') || data.formatStreams?.[0];
            if (videoStream) return videoStream.url;
          }
        } catch (e) { continue; }
      }
      return null;
    }

    // 4. Cobalt Engine z obsługą CORS Fallback i rotacją domen
    async function fetchCobalt(urlInput, quality, format) {
      const payload = {
        url: urlInput,
        videoQuality: quality,
        downloadMode: format === 'audio' ? 'audio' : 'auto',
        audioFormat: 'mp3'
      };

      const cobaltInstances = [
        'https://co.wuk.sh/api/json',
        'https://cobalt-api.kwiatekm.pl/',
        'https://api.cobalt.crush.top/',
        'https://cobalt.api.sc7.io/',
        'https://cobalt.tools/api/json'
      ];

      for (const instanceUrl of cobaltInstances) {
        try {
          const res = await fetchWithTimeout(instanceUrl, {
            method: 'POST',
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            timeout: 5000
          });

          if (!res.ok) continue;
          const data = await res.json();

          const directUrl = data.url || (data.picker && data.picker[0] ? data.picker[0].url : null);
          if (directUrl) return directUrl;
        } catch (e) {
          // Spróbuj przełączyć przez CORS Proxy jeśli bezpośrenia komunikacja rzuciła błąd
          try {
            const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(instanceUrl)}`;
            const res = await fetchWithTimeout(proxyUrl, {
              method: 'POST',
              headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
              timeout: 5000
            });
            if (!res.ok) continue;
            const data = await res.json();
            const directUrl = data.url || (data.picker && data.picker[0] ? data.picker[0].url : null);
            if (directUrl) return directUrl;
          } catch (err) { continue; }
        }
      }
      return null;
    }

    // Główna logika
    async function fetchVideo() {
      const urlInput = document.getElementById('video-url').value.trim();
      const format = document.getElementById('opt-format').value;
      const quality = document.getElementById('opt-quality').value;

      if (!urlInput) {
        alert("Podaj prawidłowy adres URL!");
        return;
      }

      const btn = document.getElementById('btn-submit');
      const statusBox = document.getElementById('status-box');
      const statusTitle = document.getElementById('status-title');
      const statusDesc = document.getElementById('status-desc');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Łączenie z API...`;

      statusBox.style.display = 'block';
      statusTitle.style.color = '#f0b90b';
      statusTitle.innerHTML = `<span class="spinner"></span> Przetwarzanie...`;
      statusDesc.innerHTML = 'Przeszukiwanie serwerów i generowanie bezpośredniego odnośnika...';

      let downloadUrl = null;
      let engineUsed = '';

      // Test 1: TikTok
      if (urlInput.includes('tiktok.com')) {
        const ttData = await fetchTikTok(urlInput);
        if (ttData) {
          downloadUrl = format === 'audio' ? ttData.audio : ttData.video;
          engineUsed = 'TikWM Direct';
        }
      }

      // Test 2: Twitter
      if (!downloadUrl && (urlInput.includes('twitter.com') || urlInput.includes('x.com'))) {
        downloadUrl = await fetchTwitter(urlInput);
        if (downloadUrl) engineUsed = 'VxTwitter Direct';
      }

      // Test 3: YouTube
      const ytId = extractYouTubeId(urlInput);
      if (!downloadUrl && ytId) {
        downloadUrl = await fetchYouTube(ytId, format);
        if (downloadUrl) engineUsed = 'Invidious / Piped Stream';
      }

      // Test 4: Zapasowy Cobalt Engine dla reszty serwisów
      if (!downloadUrl) {
        downloadUrl = await fetchCobalt(urlInput, quality, format);
        if (downloadUrl) engineUsed = 'Cobalt Network';
      }

      // Wynik
      if (downloadUrl) {
        statusTitle.style.color = '#2ea44f';
        statusTitle.innerHTML = `<i class="fas fa-check-circle"></i> Gotowe! (${engineUsed})`;
        statusDesc.innerHTML = `
          Plik wygenerowany pomyślnie.<br>
          <a href="${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn-download-direct" download>
            <i class="fas fa-file-download"></i> Pobierz plik teraz
          </a>
        `;
      } else {
        statusTitle.style.color = '#da3633';
        statusTitle.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Błąd pobierania`;
        statusDesc.innerHTML = `Żaden ze skanowanych serwerów API nie był w stanie przetworzyć podanego linku. Upewnij się, że film jest publiczny.`;
      }

      btn.disabled = false;
      btn.innerHTML = `<i class="fas fa-download"></i> Przetwarzaj i Pobierz`;
    }
  </script>
</body>
</html>
